[project]
name = "ste-competency-intelligence"
version = "0.9.0"
description = "Human-governed STE competency intelligence prototype"
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.12", "lxml>=5.0", "openai>=1.0", "openpyxl>=3.1", "pandas>=2.0", "pypdf>=5.0", "PyYAML>=6.0", "requests>=2.31", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cloud = ["filelock>=3.16,<4", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
